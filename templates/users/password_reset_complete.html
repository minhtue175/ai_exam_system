{% extends 'base.html' %}

{% block title %}Đặt lại thành công | Fluesy Exam{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card-custom p-5 bg-white text-center" style="max-width: 480px; border-radius: 20px; box-shadow: 0 10px 40px rgba(106, 53, 255, 0.08);">
        <i class="bi bi-check-circle display-1 text-success mb-3"></i>
        <h4 class="fw-bold text-dark">Đặt lại mật khẩu thành công!</h4>
        <p class="text-muted mt-3" style="font-size: 15px;">Mật khẩu mới của bạn đã được cập nhật. Bây giờ bạn có thể đăng nhập.</p>
        <a href="{% url 'users:login' %}" class="btn text-white rounded-pill px-5 py-2 mt-3 fw-bold shadow-sm" style="background: var(--fluesy-grad); border: none; font-size: 16px;">
            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập ngay
        </a>
    </div>
</div>
{% endblock %}
