{% extends 'base.html' %}

{% block title %}Email đã gửi | Fluesy Exam{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card-custom p-5 bg-white text-center" style="max-width: 480px; border-radius: 20px; box-shadow: 0 10px 40px rgba(106, 53, 255, 0.08);">
        <i class="bi bi-envelope-check display-1 mb-3" style="color: var(--primary-color); opacity: 0.7;"></i>
        <h4 class="fw-bold text-dark">Kiểm tra email của bạn!</h4>
        <p class="text-muted mt-3" style="font-size: 15px; line-height: 1.7;">
            Nếu tài khoản với email bạn cung cấp tồn tại, chúng tôi đã gửi một link đặt lại mật khẩu. Vui lòng kiểm tra hộp thư (và cả mục Spam).
        </p>
        <a href="{% url 'users:login' %}" class="btn text-white rounded-pill px-4 py-2 mt-3 fw-bold shadow-sm" style="background: var(--fluesy-grad); border: none;">
            <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
        </a>
    </div>
</div>
{% endblock %}
