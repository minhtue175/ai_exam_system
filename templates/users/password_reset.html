{% extends 'base.html' %}

{% block title %}Quên mật khẩu | Fluesy Exam{% endblock %}

{% block content %}
<style>
    .auth-card {
        width: 100%;
        max-width: 440px;
        margin: 8vh auto;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(106, 53, 255, 0.08);
    }
    .auth-form label {
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
        display: block;
        font-size: 14px;
    }
    .auth-form input[type="email"] {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1.5px solid #e2e2ec;
        background-color: #fcfcfd;
        font-size: 15px;
        transition: all 0.3s ease;
    }
    .auth-form input:focus {
        border-color: var(--primary-color);
        background-color: #fff;
        box-shadow: 0 0 0 4px var(--primary-light);
        outline: none;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card-custom auth-card p-5 bg-white">
        <div class="text-center mb-4">
            <a href="/" class="brand-logo justify-content-center mb-2" style="font-size: 38px;">
                <i class="bi bi-bezier2"></i> Fluesy
            </a>
            <div class="mt-3 mb-2">
                <i class="bi bi-envelope-paper-heart display-4" style="color: var(--primary-color); opacity: 0.7;"></i>
            </div>
            <h4 class="fw-bold text-dark mt-2">Quên mật khẩu?</h4>
            <p class="text-muted" style="font-size: 14.5px;">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_email">Địa chỉ email</label>
                {{ form.email }}
            </div>

            <button type="submit" class="btn w-100 mt-2 text-white shadow-sm" style="border-radius: 12px; padding: 14px; font-weight: 600; background: var(--fluesy-grad); border: none; font-size: 16px;">
                <i class="bi bi-send me-1"></i> Gửi link đặt lại
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'users:login' %}" class="text-muted text-decoration-none" style="font-size: 14px;">
                <i class="bi bi-arrow-left me-1"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
