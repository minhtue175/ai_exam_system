{% extends 'base.html' %}

{% block title %}Đăng nhập | Fluesy Exam{% endblock %}

{% block content %}
<style>
    
    .auth-card {
        width: 100%;
        max-width: 420px;
        margin: 5vh auto;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(106, 53, 255, 0.08);
    }
    .auth-form p {
        margin-bottom: 20px;
    }
    .auth-form label {
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 8px;
        display: block;
        font-size: 14px;
    }
    .auth-form input[type="text"],
    .auth-form input[type="password"] {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1.5px solid #e2e2ec;
        background-color: #fcfcfd;
        font-size: 15px;
        transition: all 0.3s ease;
    }
    .auth-form input:focus {
        border-color: var(--primary-color);
        background-color: #fff;
        box-shadow: 0 0 0 4px var(--primary-light);
        outline: none;
    }
    .auth-form .helptext, .auth-form .errorlist {
        font-size: 12px;
        color: #dc3545;
        margin-top: 5px;
        display: block;
        list-style: none;
        padding: 0;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card-custom auth-card p-5 bg-white">
        
        <div class="text-center mb-4">
            <a href="/" class="brand-logo justify-content-center mb-2" style="font-size: 38px;">
                <i class="bi bi-bezier2"></i> Fluesy
            </a>
            <h4 class="fw-bold text-dark mt-3">Chào mừng trở lại!</h4>
            <p class="text-muted" style="font-size: 15px;">Đăng nhập để tiếp tục lộ trình học tập</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn w-100 mt-2 text-white shadow-sm" style="border-radius: 12px; padding: 14px; font-weight: 600; background: var(--fluesy-grad); border: none; font-size: 16px;">
                Đăng nhập vào hệ thống
            </button>
        </form>

        <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1 text-muted" style="opacity: 0.25;">
            <span class="px-3 text-muted" style="font-size: 12px; font-weight: 600; letter-spacing: 0.5px;">HOẶC TIẾP TỤC VỚI</span>
            <hr class="flex-grow-1 text-muted" style="opacity: 0.25;">
        </div>

        <!-- Google OAuth2 Single Sign-On Button -->
        <button id="btn-google-login" type="button" class="btn w-100 d-flex align-items-center justify-content-center gap-2 border bg-light shadow-sm" style="border-radius: 12px; padding: 12px; font-weight: 600; font-size: 14.5px; transition: all 0.2s;">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Đăng nhập với Google</span>
        </button>

        <div class="text-center mt-3">
            <a href="{% url 'users:forgot_password' %}" class="text-muted text-decoration-none" style="font-size: 13.5px;">
                <i class="bi bi-key me-1"></i> Quên mật khẩu?
            </a>
        </div>

        <div class="text-center mt-3">
            <p class="text-muted mb-0" style="font-size: 14.5px;">Chưa có tài khoản? 
                <a href="{% url 'users:register' %}" class="fw-bold text-decoration-none" style="color: var(--primary-color);">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Xử lý Google Sign-In
    document.getElementById('btn-google-login')?.addEventListener('click', async () => {
        const userEmail = prompt('Nhập địa chỉ Gmail để đăng nhập nhanh (Google OAuth Single Sign-On):', '');
        if (!userEmail || !userEmail.includes('@')) return;

        try {
            const resp = await fetch("{% url 'users:google_login' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    email: userEmail.trim(),
                    name: userEmail.split('@')[0],
                    google_id: 'goog_' + Date.now()
                })
            });
            const data = await resp.json();
            if (data.status === 'success') {
                window.location.href = data.redirect_url;
            } else {
                alert('Lỗi đăng nhập Google: ' + (data.message || 'Không xác định'));
            }
        } catch (err) {
            alert('Lỗi kết nối khi đăng nhập Google: ' + err.message);
        }
    });
</script>
{% endblock %}
